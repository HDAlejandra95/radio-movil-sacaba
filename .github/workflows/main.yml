name: Radio Movil Sacaba V37

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build App V37
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buscar ZIP V37
        shell: bash
        run: |
          set -e

          echo "Buscando aplicación V37..."

          ZIP=$(find . -type f -name 'Radio_Movil_Sacaba_V37_Aplicacion_Unica.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP V37."
            echo "ZIP encontrados:"
            find . -type f -name '*.zip'
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "$ZIP" -d proyecto

          echo "Contenido de V37:"
          find proyecto -maxdepth 3 -type f | head -80

      - name: Detectar aplicación Flutter
        shell: bash
        run: |
          set -e

          ROOT=$(find proyecto -type f -name 'pubspec.yaml' | head -n 1 | sed 's#/pubspec.yaml##')

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró pubspec.yaml."
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Aplicación encontrada:"
          echo "$ROOT"

      - name: Crear estructura Android
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org bo.radiomovilsacaba \
            --project-name radio_movil_sacaba \
            .

          rm -rf test

      - name: Configurar permisos Android
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + permission,
                      1
                  )

          path.write_text(text)
          PY

          echo "AndroidManifest configurado:"
          cat "$MANIFEST"

      - name: Configurar URL de retorno Google
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          intent_filter = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="bo.radiomovilsacaba"/>
              </intent-filter>
          '''

          if 'android:scheme="bo.radiomovilsacaba"' not in text:
              text = text.replace(
                  '</activity>',
                  intent_filter + '\n        </activity>',
                  1
              )

          path.write_text(text)
          PY

          echo "URL de retorno configurada."

      - name: Instalar dependencias
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Verificar código
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          echo "Ejecutando análisis informativo..."
          flutter analyze lib --no-fatal-infos || true

          echo ""
          echo "El análisis no detendrá la compilación."
          echo "Los errores reales serán comprobados durante flutter build apk."

      - name: Compilar APK V37
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "COMPILANDO RADIO MOVIL SACABA V37"
          echo "========================================"

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Flutter no generó el APK."
            echo ""
            echo "Archivos encontrados:"
            find build -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK GENERADO CORRECTAMENTE"
          echo "========================================"

          ls -lh "$APK"

      - name: Subir APK V37
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Movil-Sacaba-V37
          path: ${{ env.ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
