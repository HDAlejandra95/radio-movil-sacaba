name: Compilar Radio Movil Sacaba V35

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        app:
          - pasajero
          - conductor

    steps:

      # ==========================================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5


      # ==========================================================
      # 2. BUSCAR ZIP V35
      # ==========================================================

      - name: Buscar ZIP V35
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUSCANDO RADIO MOVIL SACABA V35"
          echo "=========================================="

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname '*V35*.zip' \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: NO SE ENCONTRO EL ZIP V35."
            echo ""
            echo "ZIP DISPONIBLES:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip'

            exit 1
          fi

          echo ""
          echo "ZIP SELECCIONADO:"
          echo "$ZIP_FILE"
          echo ""

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================================
      # 3. DESCOMPRIMIR V35
      # ==========================================================

      - name: Descomprimir V35
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DESCOMPRIMIENDO V35"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/proyecto"

          mkdir -p "$GITHUB_WORKSPACE/proyecto"

          unzip -o "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/proyecto"

          echo ""
          echo "CONTENIDO DE V35:"
          echo ""

          find "$GITHUB_WORKSPACE/proyecto" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -200


      # ==========================================================
      # 4. DETECTAR CARPETA RAIZ
      # ==========================================================

      - name: Detectar proyecto
        id:
