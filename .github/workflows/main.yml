name: Compilar Radio Movil Sacaba V33

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Buscar y descomprimir V33
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname '*V33*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP V33"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

          echo "Contenido:"
          find proyecto -maxdepth 3 -type f -name pubspec.yaml -print

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Pasajero
        run: |
          set -e

          PASAJERO=$(find proyecto -type f -name pubspec.yaml -path '*/pasajero/pubspec.yaml' | head -n 1)

          if [ -z "$PASAJERO" ]; then
            echo "ERROR: No se encontró el proyecto pasajero"
            exit 1
          fi

          PASAJERO_DIR=$(dirname "$PASAJERO")
          echo "Pasajero: $PASAJERO_DIR"

          cd "$PASAJERO_DIR"

          flutter pub get
          flutter build apk --release

      - name: Guardar APK Pasajero
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Movil-Sacaba-Pasajero-V33
          path: '**/build/app/outputs/flutter-apk/app-release.apk'

      - name: Preparar Conductor
        run: |
          set -e

          CONDUCTOR=$(find proyecto -type f -name pubspec.yaml -path '*/conductor/pubspec.yaml' | head -n 1)

          if [ -z "$CONDUCTOR" ]; then
            echo "ERROR: No se encontró el proyecto conductor"
            exit 1
          fi

          CONDUCTOR_DIR=$(dirname "$CONDUCTOR")
          echo "Conductor: $CONDUCTOR_DIR"

          cd "$CONDUCTOR_DIR"

          flutter pub get
          flutter build apk --release

      - name: Guardar APK Conductor
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Movil-Sacaba-Conductor-V33
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
