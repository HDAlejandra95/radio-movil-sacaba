name: Compilar Radio Movil Sacaba V34

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [pasajero, conductor]

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto Android completo
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --org bo.radiomovilsacaba \
            --project-name radio_movil_sacaba_${{ matrix.app }} \
            .

      - name: Configurar permisos de ubicación
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          perms = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          """

          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace(marker, marker + perms)

          p.write_text(s)
          PY

      - name: Instalar dependencias
        working-directory: ${{ matrix.app }}
        run: |
          flutter pub get

      - name: Verificar proyecto
        working-directory: ${{ matrix.app }}
        run: |
          flutter analyze --no-fatal-infos

      - name: Compilar APK release
        working-directory: ${{ matrix.app }}
        run: |
          flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-movil-sacaba-${{ matrix.app }}-apk-v34
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
