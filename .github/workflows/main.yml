name: Radio Movil Sacaba V36

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - pasajero
          - conductor

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buscar ZIP V35
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -name "*V35*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP V35."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          mkdir -p proyecto
          unzip -q "$ZIP" -d proyecto

          echo "Contenido:"
          find proyecto -maxdepth 3 -type f | head -50

      - name: Detectar carpeta del proyecto
        shell: bash
        run: |
          set -e

          ROOT=$(find proyecto -type f -path "*/pasajero/pubspec.yaml" | head -n 1 | sed 's#/pasajero/pubspec.yaml##')

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró la carpeta pasajero."
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $ROOT"

      - name: Preparar aplicación
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        shell: bash
        run: |
          set -e

          echo "Preparando aplicación: ${{ matrix.app }}"

          flutter create \
            --platforms=android \
            --org bo.radiomovilsacaba \
            --project-name "radio_movil_sacaba_${{ matrix.app }}" \
            .

          rm -rf test

      - name: Configurar permisos Android
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Configurando: $MANIFEST"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission
              )

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]

          for p in permissions:
              if p not in text:
                  text = text.replace(
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                      '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + p
                  )

          manifest.write_text(text)
          PY

          echo "Manifest final:"
          cat "$MANIFEST"

      - name: Obtener dependencias
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          flutter pub get

      - name: Analizar código
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          flutter analyze lib --no-fatal-infos

      - name: Compilar APK
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          flutter build apk --release

      - name: Preparar APK
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        shell: bash
        run: |
          set -e

          mkdir -p ../../../salida

          cp build/app/outputs/flutter-apk/app-release.apk \
            "../../../salida/Radio_Movil_Sacaba_V36_${{ matrix.app }}.apk"

          ls -lh ../../../salida/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Movil-Sacaba-V36-${{ matrix.app }}
          path: salida/Radio_Movil_Sacaba_V36_${{ matrix.app }}.apk
