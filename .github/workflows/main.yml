name: Radio Movil Sacaba V36

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - pasajero
          - conductor

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buscar y extraer V35
        run: |
          set -e

          echo "Buscando ZIP V35..."

          ZIP=$(find . -type f -name '*V35*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún ZIP V35."
            find . -type f -name '*.zip'
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -q "$ZIP" -d proyecto

          echo "Contenido:"
          find proyecto -maxdepth 3 -type f | head -50

      - name: Detectar proyecto
        run: |
          set -e

          ROOT=$(find proyecto -type f -path '*/pasajero/pubspec.yaml' | head -n 1 | sed 's#/pasajero/pubspec.yaml##')

          if [ -z "$ROOT" ]; then
            echo "ERROR: No se encontró el proyecto Flutter."
            find proyecto -type f -name pubspec.yaml
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Proyecto:"
          echo "$ROOT"

      - name: Crear estructura Android
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org bo.radiomovilsacaba \
            --project-name "radio_movil_sacaba_${{ matrix.app }}" \
            .

          rm -rf test

      - name: Agregar permisos Android
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Archivo:"
          echo "$MANIFEST"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + permission,
                      1
                  )

          path.write_text(text)
          PY

          echo ""
          echo "===== MANIFEST ====="
          cat "$MANIFEST"
          echo "===================="

      - name: Instalar dependencias
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          flutter pub get

      - name: Analizar aplicación
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          flutter analyze lib --no-fatal-infos

      - name: Compilar APK
        working-directory: ${{ env.ROOT }}/${{ matrix.app }}
        run: |
          set -e

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK."
            find build -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh "$APK"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Movil-Sacaba-V36-${{ matrix.app }}
          path: ${{ env.ROOT }}/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
